<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Skylight Farm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-logo">🌾 Skylight Farm</div>
      <h1 class="auth-title">Sign in</h1>
      <p class="auth-subtitle">Access your weather and crop data</p>
    </div>

    <div id="authMessage" class="auth-alert"></div>

    <form id="loginForm" class="auth-form">
      <div class="form-group">
        <label for="username">Email or Username</label>
        <input 
          id="username"
          name="username" 
          type="text" 
          placeholder="you@example.com" 
          required 
          autocomplete="username"
        />
        <span class="form-error">Please enter a valid email or username</span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          id="password"
          name="password" 
          type="password" 
          placeholder="Enter your password" 
          required 
          autocomplete="current-password"
        />
        <span class="form-error">Password is required</span>
      </div>

      <button type="submit" class="auth-button">Sign in</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Create one</a>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    // Apply saved theme
    const savedTheme = localStorage.getItem("skylight-theme") || "dark";
    document.body.dataset.theme = savedTheme;

    // Initialize login form
    initAuthForm({
      formId: "loginForm",
      endpoint: "backend/login.php",
      buildPayload: (data) => ({
        identifier: data.username,  // Backend expects 'identifier', not 'username'
        password: data.password,
      }),
      validate: (data) => {
        if (!data.username || !data.password) {
          return "Email/username and password are required.";
        }
        if (data.username.length < 3) {
          return "Email/username must be at least 3 characters.";
        }
        return null;
      },
      onSuccess: (result) => {
        setTimeout(() => {
          window.location.href = "index.html";
        }, 1500);
      },
    });
  </script>
</body>
</html>
